services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gridwatch
      POSTGRES_PASSWORD: gridwatch
      POSTGRES_DB: gridwatch
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gridwatch']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: postgres://gridwatch:gridwatch@postgres:5432/gridwatch
      REDIS_URL: redis://redis:6379
      JWT_SECRET: gridwatch-secret-key
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: node dist/seed.js
    environment:
      DATABASE_URL: postgres://gridwatch:gridwatch@postgres:5432/gridwatch
      REDIS_URL: redis://redis:6379
      JWT_SECRET: gridwatch-secret-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - seed

  frontend:
    build:
      context: ./frontend/gridwatch
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  pgdata:
